# ALSA UCM2 HiFi profile for Nubia RedMagic 9 Pro (NX769J, SM8650)
#
# All codec sequences are inlined rather than including stock Kubuntu 26.04
# /codecs/wcd939x/* and /codecs/qcom-lpass/* snippets, fixing 5 upstream bugs
# verified against Linux 7.1.1-nx769j+ .ko binaries:
#   1. HeadphoneDisableSeq used removed enum 'CLS_H_INVALID' -> fixed to 'CLS_H_NORMAL'
#   2. AnalogMic*EnableSeq used non-existent 'TX0 MODE = ADC_ULP' -> fixed to 'ADC_NORMAL'
#   3. tx-macro HeadphoneMicEnableSeq used 'ADC1' -> fixed to 'SWR_MIC1' (with SoundWire <2 2 4 5>)
#   4. QRD HiFi.conf used non-existent 'HP Digital' -> fixed to 'HP' (from wcd939x/init.conf remap)
#   5. AudioReach MODULE_ID_GAIN Q13 unity gain = 8192 (0x2000 = 0.0 dB, NOT 65535 = +18 dB clip)

SectionVerb {
	EnableSequence [
		cset "name='RX_CODEC_DMA_RX_0 Audio Mixer MultiMedia1' 1"
		cset "name='PRIMARY_MI2S_RX Audio Mixer MultiMedia2' 1"
		cset "name='MultiMedia3 Mixer TX_CODEC_DMA_TX_3' 1"
		cset "name='stream0.vol_ctrl0 MultiMedia1 Playback Volu' 8192"
		cset "name='stream1.vol_ctrl1 MultiMedia2 Playback Volu' 8192"
		cset "name='HPHL Volume' 20"
		cset "name='HPHR Volume' 20"
		cset "name='RX_RX0 Digital Volume' 84"
		cset "name='RX_RX1 Digital Volume' 84"
	]

	DisableSequence [
		cset "name='RX_CODEC_DMA_RX_0 Audio Mixer MultiMedia1' 0"
		cset "name='PRIMARY_MI2S_RX Audio Mixer MultiMedia2' 0"
		cset "name='MultiMedia3 Mixer TX_CODEC_DMA_TX_3' 0"
	]

	Value {
		TQ "HiFi"
	}
}

SectionDevice."Speaker" {
	Comment "Stereo Speakers"

	ConflictingDevice [
		"Earpiece"
	]

	EnableSequence [
		exec "/usr/local/sbin/aw88261-init set-mode speaker"
	]

	DisableSequence [
	]

	Value {
		PlaybackChannels 2
		PlaybackPriority 100
		PlaybackPCM "hw:${CardId},1"
	}
}

SectionDevice."Earpiece" {
	Comment "Earpiece"

	ConflictingDevice [
		"Speaker"
	]

	EnableSequence [
		exec "/usr/local/sbin/aw88261-init set-mode receiver"
	]

	DisableSequence [
		exec "/usr/local/sbin/aw88261-init set-mode speaker"
	]

	Value {
		PlaybackChannels 2
		PlaybackPriority 50
		PlaybackPCM "hw:${CardId},1"
	}
}

SectionDevice."Headphones" {
	Comment "3.5mm Headphones"

	EnableSequence [
		cset "name='RX_HPH PWR Mode' LOHIFI"
		cset "name='RX_MACRO RX0 MUX' AIF1_PB"
		cset "name='RX_MACRO RX1 MUX' AIF1_PB"
		cset "name='RX INT0_1 MIX1 INP0' RX0"
		cset "name='RX INT1_1 MIX1 INP0' RX1"
		cset "name='RX INT0 DEM MUX' CLSH_DSM_OUT"
		cset "name='RX INT1 DEM MUX' CLSH_DSM_OUT"
		cset "name='RX_COMP1 Switch' 1"
		cset "name='RX_COMP2 Switch' 1"
		cset "name='CLSH Switch' 1"
		cset "name='RX HPH Mode' CLS_H_ULP"
		cset "name='HPHL_COMP Switch' 1"
		cset "name='HPHR_COMP Switch' 1"
		cset "name='HPHL_RDAC Switch' 1"
		cset "name='HPHR_RDAC Switch' 1"
		cset "name='HPHL Switch' 1"
		cset "name='HPHR Switch' 1"
	]

	DisableSequence [
		cset "name='HPHL Switch' 0"
		cset "name='HPHR Switch' 0"
		cset "name='HPHL_RDAC Switch' 0"
		cset "name='HPHR_RDAC Switch' 0"
		cset "name='HPHL_COMP Switch' 0"
		cset "name='HPHR_COMP Switch' 0"
		cset "name='CLSH Switch' 0"
		cset "name='RX HPH Mode' CLS_H_NORMAL"
		cset "name='RX_COMP1 Switch' 0"
		cset "name='RX_COMP2 Switch' 0"
		cset "name='RX INT0 DEM MUX' NORMAL_DSM_OUT"
		cset "name='RX INT1 DEM MUX' NORMAL_DSM_OUT"
		cset "name='RX INT0_1 MIX1 INP0' ZERO"
		cset "name='RX INT1_1 MIX1 INP0' ZERO"
		cset "name='RX_MACRO RX0 MUX' ZERO"
		cset "name='RX_MACRO RX1 MUX' ZERO"
	]

	Value {
		PlaybackChannels 2
		PlaybackPriority 200
		PlaybackPCM "hw:${CardId},0"
		PlaybackMixer "default:${CardId}"
		PlaybackMixerElem "HP"
		JackControl "Headphone Jack"
		JackHWMute "Speaker"
	}
}

SectionDevice."Mic1" {
	Comment "Bottom Microphone"

	ConflictingDevice [
		"Mic2"
		"Headset"
	]

	EnableSequence [
		cset "name='ADC1_MIXER Switch' 1"
		cset "name='ADC1 MUX' CH1_AMIC1"
		cset "name='TX0 MODE' ADC_NORMAL"
		cset "name='ADC1 Switch' 1"
		cset "name='ADC1 Volume' 12"
		cset "name='TX DEC0 MUX' SWR_MIC"
		cset "name='TX SMIC MUX0' SWR_MIC0"
		cset "name='DEC0 MODE' ADC_DEFAULT"
		cset "name='TX_AIF1_CAP Mixer DEC0' 1"
		cset "name='TX_DEC0 Volume' 102"
		cset "name='TX DEC1 MUX' SWR_MIC"
		cset "name='TX SMIC MUX1' SWR_MIC0"
		cset "name='DEC1 MODE' ADC_DEFAULT"
		cset "name='TX_AIF1_CAP Mixer DEC1' 1"
		cset "name='TX_DEC1 Volume' 102"
	]

	DisableSequence [
		cset "name='TX_AIF1_CAP Mixer DEC0' 0"
		cset "name='TX_AIF1_CAP Mixer DEC1' 0"
		cset "name='TX SMIC MUX0' ZERO"
		cset "name='TX SMIC MUX1' ZERO"
		cset "name='ADC1_MIXER Switch' 0"
		cset "name='ADC1 MUX' CH1_AMIC_DISABLE"
		cset "name='ADC1 Switch' 0"
	]

	Value {
		CaptureChannels 2
		CapturePriority 200
		CapturePCM "hw:${CardId},2"
		CaptureMixerElem "ADC1"
	}
}

SectionDevice."Mic2" {
	Comment "Top Microphone"

	ConflictingDevice [
		"Mic1"
		"Headset"
	]

	EnableSequence [
		cset "name='ADC1_MIXER Switch' 1"
		cset "name='ADC1 MUX' CH1_AMIC3"
		cset "name='TX0 MODE' ADC_NORMAL"
		cset "name='ADC1 Switch' 1"
		cset "name='ADC1 Volume' 12"
		cset "name='TX DEC0 MUX' SWR_MIC"
		cset "name='TX SMIC MUX0' SWR_MIC0"
		cset "name='DEC0 MODE' ADC_DEFAULT"
		cset "name='TX_AIF1_CAP Mixer DEC0' 1"
		cset "name='TX_DEC0 Volume' 102"
		cset "name='TX DEC1 MUX' SWR_MIC"
		cset "name='TX SMIC MUX1' SWR_MIC0"
		cset "name='DEC1 MODE' ADC_DEFAULT"
		cset "name='TX_AIF1_CAP Mixer DEC1' 1"
		cset "name='TX_DEC1 Volume' 102"
	]

	DisableSequence [
		cset "name='TX_AIF1_CAP Mixer DEC0' 0"
		cset "name='TX_AIF1_CAP Mixer DEC1' 0"
		cset "name='TX SMIC MUX0' ZERO"
		cset "name='TX SMIC MUX1' ZERO"
		cset "name='ADC1_MIXER Switch' 0"
		cset "name='ADC1 MUX' CH1_AMIC_DISABLE"
		cset "name='ADC1 Switch' 0"
	]

	Value {
		CaptureChannels 2
		CapturePriority 100
		CapturePCM "hw:${CardId},2"
		CaptureMixerElem "ADC1"
	}
}

SectionDevice."Headset" {
	Comment "3.5mm Headset Microphone"

	ConflictingDevice [
		"Mic1"
		"Mic2"
	]

	EnableSequence [
		cset "name='ADC2_MIXER Switch' 1"
		cset "name='ADC2 MUX' CH2_AMIC2"
		cset "name='TX1 MODE' ADC_LP"
		cset "name='ADC2 Switch' 1"
		cset "name='ADC2 Volume' 12"
		cset "name='MBHC Switch' 1"
		cset "name='TX DEC0 MUX' SWR_MIC"
		cset "name='TX SMIC MUX0' SWR_MIC1"
		cset "name='DEC0 MODE' ADC_DEFAULT"
		cset "name='TX_AIF1_CAP Mixer DEC0' 1"
		cset "name='TX_DEC0 Volume' 108"
		cset "name='TX DEC1 MUX' SWR_MIC"
		cset "name='TX SMIC MUX1' SWR_MIC1"
		cset "name='DEC1 MODE' ADC_DEFAULT"
		cset "name='TX_AIF1_CAP Mixer DEC1' 1"
		cset "name='TX_DEC1 Volume' 108"
	]

	DisableSequence [
		cset "name='TX_AIF1_CAP Mixer DEC0' 0"
		cset "name='TX_AIF1_CAP Mixer DEC1' 0"
		cset "name='TX SMIC MUX0' ZERO"
		cset "name='TX SMIC MUX1' ZERO"
		cset "name='MBHC Switch' 0"
		cset "name='ADC2_MIXER Switch' 0"
		cset "name='ADC2 MUX' CH2_AMIC_DISABLE"
		cset "name='ADC2 Switch' 0"
	]

	Value {
		CaptureChannels 2
		CapturePriority 300
		CapturePCM "hw:${CardId},2"
		CaptureMixerElem "ADC2"
		JackControl "Mic Jack"
		JackHWMute "Mic1"
		JackHWMute "Mic2"
	}
}
