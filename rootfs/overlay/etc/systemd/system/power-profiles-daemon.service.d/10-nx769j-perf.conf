# Prevent power-profiles-daemon's generic cpufreq driver from overwriting
# SM8650 (qcom-cpufreq-hw) scaling_max_freq / boost on USB AC plug/unplug;
# nx769j-perf.service owns SM8650 cpufreq, Adreno 750 devfreq, and pwmfan.
[Service]
ExecStart=
ExecStart=/usr/lib/power-profiles-daemon --block-driver=cpufreq
