[Unit]
Description=NX769J SensorProxy D-Bus Bridge (ADSP LSM6DSO IMU -> net.hadess.SensorProxy)
After=dbus.service nx769j-imu-daemon.service
Wants=nx769j-imu-daemon.service

[Service]
ExecStart=
ExecStart=/usr/local/libexec/nx769j-sensor-proxy
ProtectSystem=false
PrivateTmp=false
ProtectHome=true
MemoryDenyWriteExecute=false
RestrictAddressFamilies=
RestrictAddressFamilies=AF_UNIX AF_LOCAL AF_NETLINK AF_QIPCRTR
Restart=on-failure
RestartSec=1s

[Install]
WantedBy=multi-user.target
