# /etc/pacman.conf — NX769J Omarchy Mobile (Arch Linux ARM aarch64)
[options]
HoldPkg     = pacman glibc
Architecture = aarch64

Color
CheckSpace
ParallelDownloads = 5
# Linux 7.1.1-nx769j+ omits CONFIG_SECURITY_LANDLOCK; disable Landlock/seccomp ALPM sandbox cleanly
DisableSandboxFilesystem
DisableSandboxSyscalls

SigLevel    = Required DatabaseOptional
LocalFileSigLevel = Optional

[core]
Include = /etc/pacman.d/mirrorlist

[extra]
Include = /etc/pacman.d/mirrorlist

[alarm]
Include = /etc/pacman.d/mirrorlist

[aur]
Include = /etc/pacman.d/mirrorlist
