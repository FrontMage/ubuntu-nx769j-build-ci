# NX769J (SM8650 AudioReach + Dual AW88261 SmartPA + WCD9395) WirePlumber rules:
#   1. Default Speaker/Headphone route volume = 0.512 linear (0.80 = 80% cubic,
#      -5.82 dB) instead of WirePlumber's 0.064 linear (40% cubic = -23.88 dB)
#      global fallback for UCM cards without hardware PlaybackMixerElem.
#   2. Explicit default-source-volume = 1.0 so microphones do not inherit 0.512.
#   3. Re-enable node.pause-on-idle = true + session.suspend-timeout-seconds = 3
#      (overriding WirePlumber monitors/alsa.lua's pause-on-idle = false on UCM
#      internal nodes) so idle/paused Chromium & media streams close pcmC0D1p,
#      allowing qcom-apm to tear down stale graphs and nx769j-aw88261.service
#      to power down both AW88261 SmartPAs (0x35 & 0x34) to 0 mA standby.

monitor.alsa.rules = [
  {
    matches = [
      {
        device.name = "alsa_card.platform-sound"
      }
    ]
    actions = {
      update-props = {
        device.routes.default-sink-volume = 0.512
        device.routes.default-source-volume = 1.0
      }
    }
  }
  {
    matches = [
      {
        node.name = "~alsa_output.platform-sound.*"
      }
    ]
    actions = {
      update-props = {
        node.pause-on-idle = true
        session.suspend-timeout-seconds = 3
      }
    }
  }
  {
    matches = [
      {
        node.name = "~alsa_input.platform-sound.*"
      }
    ]
    actions = {
      update-props = {
        node.pause-on-idle = true
        session.suspend-timeout-seconds = 3
      }
    }
  }
]
